<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Reading practice</title>
<link rel="stylesheet" href="practice.css">
</head>
<body>
<header>
  <h1 id="title">IELTS Academic Reading</h1>
  <nav id="pick"></nav>
  <span id="clock"></span>
</header>
<main>
  <p class="muted">3 passages · 40 questions · 60 minutes, as in the computer-delivered Academic test. Write answers straight in; spelling and word limits count. The timer submits at 0:00. Answers save as you type.</p>
  <div class="bar"><button class="go" id="start">Start the 60-minute timer</button></div>
  <div id="body"></div>
  <div class="bar"><button class="go" id="submit">Submit and mark</button><button class="ghost" id="reset">Clear this test</button></div>
  <div id="score"></div>
</main>
