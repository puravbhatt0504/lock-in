# Publishes the practice tests to GitHub Pages so they work on a phone, microphone included.
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Practice tests on Pages

on:
  push:
    branches: [main]
    paths:
      - chrome-extension/practice/**
      - chrome-extension/material/mock-*
      - mobile/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash mobile/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
